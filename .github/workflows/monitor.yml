name: Monitor de sitios IPUL

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (hora UTC)
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions
    inputs:
      probar_telegram:
        description: "Enviar un mensaje de prueba a Telegram aunque todo esté bien"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar sitios
        run: node check.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.probar_telegram }}
